# Estructura esperada:
#   smtek/
#   ├── docker-compose.yml
#   ├── docker/php/{Dockerfile,entrypoint.sh}
#   └── src/            <- proyecto Laravel

services:
  # ---------- Laravel (PHP 8.2 ZTS) ----------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: smtek_app
    restart: unless-stopped
    working_dir: /var/www/html
    # El entrypoint corre composer install, key:generate, storage:link y migrate
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Estas variables tienen prioridad sobre src/.env
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smtek

  # ---------- Node / Vite (npm install + npm run dev) ----------
  node:
    image: node:22-alpine
    container_name: smtek_node
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/app
    networks:
      - smtek

  # ---------- Base de datos ----------
  db:
    image: mariadb:13
    container_name: smtek_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smtek

  # ---------- phpMyAdmin ----------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: smtek_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smtek

volumes:
  db_data:

networks:
  smtek:
    driver: bridge
