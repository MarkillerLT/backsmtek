services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: smtek_app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Overrides src/.env
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Only Anubis (on anubis_backend) may set X-Forwarded-* headers
      TRUSTED_PROXIES: ${ANUBIS_BACKEND_SUBNET:-10.201.53.0/24}
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smtek
      - anubis_backend

  # Browser -> proxy (localhost:8081) -> anubis -> app:8000
  # Direct access to http://localhost:8000 (without Anubis) keeps working.
  proxy:
    image: caddy:2.11.9-alpine
    container_name: smtek_proxy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
      # Debug without Anubis through the same URL: ANUBIS_UPSTREAM=host.docker.internal:8000
      ANUBIS_UPSTREAM: ${ANUBIS_UPSTREAM:-anubis:8923}
    ports:
      - "${PROXY_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Directory mount + --watch: edits to the Caddyfile are applied without a restart
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    volumes:
      - ./docker/proxy:/etc/caddy:ro
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      anubis:
        condition: service_healthy
    networks:
      - edge

  anubis:
    build:
      context: .
      dockerfile: docker/anubis/Dockerfile
    image: smtek-anubis:latest
    container_name: smtek_anubis
    restart: unless-stopped
    environment:
      BIND: ":8923"
      METRICS_BIND: ":9090"
      TARGET: http://app:8000
      DIFFICULTY: ${ANUBIS_DIFFICULTY:-4}
      FORCED_LANGUAGE: es
      SERVE_ROBOTS_TXT: "false"
      # Plain HTTP on localhost: no Secure flag, and therefore no Partitioned
      # flag either (browsers reject Partitioned cookies that are not Secure)
      COOKIE_SECURE: ${ANUBIS_COOKIE_SECURE:-false}
      COOKIE_PARTITIONED: ${ANUBIS_COOKIE_PARTITIONED:-false}
      # Host as typed in the browser, port included (open the site as localhost)
      REDIRECT_DOMAINS: ${ANUBIS_REDIRECT_DOMAINS:-localhost:${PROXY_PORT:-8081}}
      SLOG_LEVEL: ${ANUBIS_LOG_LEVEL:-INFO}
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_ED25519_PRIVATE_KEY_HEX:-}
    # Live policy edits: change docker/anubis/policy/botPolicy.yaml, then
    # `docker compose restart anubis` (Anubis reads the policy at startup)
    volumes:
      - ./docker/anubis/policy:/data/cfg:ro
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - app
    networks:
      - edge
      - anubis_backend

  node:
    image: node:lts-alpine
    container_name: smtek_node
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # laravel-vite-plugin's container mode: listen on 0.0.0.0 inside the
      # container and write http://localhost:5173 to public/hot. Without it Vite
      # only listened on the container's loopback and :5173 was unreachable.
      LARAVEL_SAIL: "1"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/app
    networks:
      - smtek

  db:
    image: mariadb:lts
    container_name: smtek_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smtek

  phpmyadmin:
    image: phpmyadmin:5
    container_name: smtek_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smtek

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  smtek:
    driver: bridge
  # proxy <-> anubis
  edge:
    driver: bridge
  # anubis <-> app. Fixed subnet so Laravel can trust exactly this range.
  anubis_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${ANUBIS_BACKEND_SUBNET:-10.201.53.0/24}
