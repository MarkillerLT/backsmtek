# Request path: Internet -> proxy (Caddy, 80/443) -> anubis -> app (FrankenPHP :8080)
#
# Networks:
#   edge            proxy <-> anubis
#   anubis_backend  anubis <-> app (internal, fixed subnet trusted by Laravel)
#   smtek           app, queue, scheduler <-> db (and phpmyadmin)
# The app publishes no ports and the proxy is not on the app's networks, so the
# only way to reach Laravel from outside is through Anubis.

x-app: &app
  build:
    context: .
    dockerfile: docker/prod/Dockerfile
  image: smtek-app:latest
  restart: unless-stopped
  env_file: .env.production
  volumes:
    - app_storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
  networks:
    - smtek

services:
  proxy:
    image: caddy:2.11.9-alpine
    container_name: smtek_proxy
    restart: unless-stopped
    # Same UID as the user that owned these volumes in the FrankenPHP image,
    # so existing certificates stay readable/renewable (the binary has
    # cap_net_bind_service to bind 80/443 without root).
    user: "1000:1000"
    environment:
      SITE_ADDRESS: ${SERVER_NAME:?SERVER_NAME is missing in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Directory mount + --watch: edits to the Caddyfile are applied without a restart
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    volumes:
      - ./docker/proxy:/etc/caddy:ro
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      anubis:
        condition: service_healthy
    networks:
      - edge

  anubis:
    build:
      context: .
      dockerfile: docker/anubis/Dockerfile
    image: smtek-anubis:latest
    container_name: smtek_anubis
    restart: unless-stopped
    environment:
      BIND: ":8923"
      METRICS_BIND: ":9090"
      TARGET: http://app:8080
      # The policy (docker/anubis/policy/botPolicy.yaml) is baked into the image
      DIFFICULTY: ${ANUBIS_DIFFICULTY:-4}
      FORCED_LANGUAGE: es
      # Laravel serves its own robots.txt (allowed by the policy)
      SERVE_ROBOTS_TXT: "false"
      COOKIE_SECURE: "true"
      REDIRECT_DOMAINS: ${ANUBIS_REDIRECT_DOMAINS:-${SERVER_NAME}}
      SLOG_LEVEL: ${ANUBIS_LOG_LEVEL:-INFO}
      # Keeps visitors' Anubis cookies valid across restarts. If empty, a random
      # key is generated on every start and visitors are challenged again.
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_ED25519_PRIVATE_KEY_HEX:-}
      WEBMASTER_EMAIL: ${ANUBIS_WEBMASTER_EMAIL:-}
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
      - anubis_backend

  app:
    <<: *app
    container_name: smtek_app
    environment:
      # Only Anubis (on anubis_backend) may set X-Forwarded-* headers
      TRUSTED_PROXIES: ${ANUBIS_BACKEND_SUBNET:-10.201.53.0/24}
    networks:
      - smtek
      - anubis_backend

  queue:
    <<: *app
    container_name: smtek_queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true   # the inherited FrankenPHP healthcheck probes the web server, which doesn't run here

  scheduler:
    <<: *app
    container_name: smtek_scheduler
    command: php artisan schedule:work
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true

  db:
    image: mariadb:lts
    container_name: smtek_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is missing in .env.production}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is missing in .env.production}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in .env.production}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smtek

  phpmyadmin:
    image: phpmyadmin:5
    container_name: smtek_phpmyadmin
    profiles: ["admin"]
    restart: "no"
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
    networks:
      - smtek

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:

networks:
  smtek:
  edge:
  anubis_backend:
    internal: true
    ipam:
      config:
        - subnet: ${ANUBIS_BACKEND_SUBNET:-10.201.53.0/24}
