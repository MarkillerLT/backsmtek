x-app: &app
  build:
    context: .
    dockerfile: docker/prod/Dockerfile
  image: smtek-app:latest
  restart: unless-stopped
  env_file: .env.production
  volumes:
    - app_storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
  networks:
    - smtek

services:
  app:
    <<: *app
    container_name: smtek_app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy

  queue:
    <<: *app
    container_name: smtek_queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true   # the inherited FrankenPHP healthcheck probes the web server, which doesn't run here

  scheduler:
    <<: *app
    container_name: smtek_scheduler
    command: php artisan schedule:work
    environment:
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true

  db:
    image: mariadb:lts
    container_name: smtek_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is missing in .env.production}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is missing in .env.production}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in .env.production}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smtek

  phpmyadmin:
    image: phpmyadmin:5
    container_name: smtek_phpmyadmin
    profiles: ["admin"]
    restart: "no"
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
    networks:
      - smtek

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:

networks:
  smtek:
