name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA of an already published image to roll back to (empty = build current commit)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/anubis/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}/anubis:${{ github.sha }}
            ${{ env.IMAGE }}/anubis:latest
          cache-from: type=gha,scope=anubis
          cache-to: type=gha,mode=max,scope=anubis

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/smtek' }}
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag || github.sha }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose file, bin/prod and the edge Caddyfile
        run: |
          files="docker-compose.prod.yml bin/prod"
          [ -f docker/proxy/Caddyfile ] && files="$files docker/proxy/Caddyfile"
          tar -cz $files | ssh vps "mkdir -p '$VPS_PATH' && tar -xz -C '$VPS_PATH'"

      - name: Log in to GHCR from the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        run: |
          ssh vps bash -s -- "$VPS_PATH" "$IMAGE" <<'EOF'
          set -euo pipefail
          cd "$1"
          IMAGE="$2"

          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker pull "$IMAGE"
          docker tag "$IMAGE" smtek-app:latest

          # Commits before the Anubis integration have no Anubis image
          if grep -q 'smtek-anubis' docker-compose.prod.yml; then
            ANUBIS_IMAGE="${IMAGE%:*}/anubis:${IMAGE##*:}"
            docker pull "$ANUBIS_IMAGE"
            docker tag "$ANUBIS_IMAGE" smtek-anubis:latest
            # The edge Caddy runs as UID 1000; make sure fresh volumes are writable (no-op otherwise)
            bin/prod run --rm --no-deps -T --user 0:0 --entrypoint chown proxy -R 1000:1000 /data/caddy /config/caddy </dev/null
          fi

          bin/prod up -d --no-build --wait db
          # The script arrives on stdin; without </dev/null, compose run would swallow the rest of it
          bin/prod run --rm -T app php artisan migrate --force </dev/null
          # --remove-orphans: stops proxy/anubis when rolling back to a commit without them
          bin/prod up -d --no-build --wait --wait-timeout 180 --remove-orphans

          # Keep a week of images available for rollbacks
          docker image prune -af --filter "until=168h" >/dev/null
          bin/prod ps
          EOF

      - name: Check that the site responds
        if: vars.APP_URL != ''
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.APP_URL }}"
